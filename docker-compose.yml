services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gembid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gembid}
      POSTGRES_DB: ${POSTGRES_DB:-gembid}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gembid}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gembid}:${POSTGRES_PASSWORD:-gembid}@db:5432/${POSTGRES_DB:-gembid}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv   # anonymous volume: keeps the container's venv from being overwritten by the host mount
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: